<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Профиль - CodeQuest</title>
    <link rel="stylesheet" href="style.css">
    <script src="i18n.js"></script>
    <script src="drag.js"></script>
    <style>
        .profile-card {
            background: var(--bg-card); border: var(--border-primary); border-radius: 8px;
            padding: 24px; display: flex; flex-direction: column; gap: 20px; margin-top: 20px;
        }
        .profile-header { display: flex; align-items: center; gap: 20px; }
        .profile-avatar {
            width: 80px; height: 80px; border-radius: 50%; background: var(--bg-code-secondary);
            display: flex; align-items: center; justify-content: center; font-size: 40px;
            border: 2px solid var(--border-color); overflow: hidden; position: relative;
            cursor: pointer; transition: border-color 0.2s; flex-shrink: 0;
        }
        .profile-avatar:hover { border-color: var(--brand-bright); }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .profile-avatar-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); color: white; display: flex; align-items: center;
            justify-content: center; font-size: 24px; opacity: 0; transition: opacity 0.2s;
        }
        .profile-avatar:hover .profile-avatar-overlay { opacity: 1; }
        .profile-info h2 { margin: 0 0 8px 0; font-size: 24px; }
        .profile-info p { margin: 0; color: var(--text-secondary); font-size: 16px; }
        .profile-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; }
        .stat-box {
            background: var(--bg-code-secondary); padding: 16px; border-radius: 8px;
            text-align: center; border: 1px solid var(--border-color);
        }
        .stat-box .val { font-size: 24px; font-weight: bold; color: var(--brand-bright); }
        .stat-box .label { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }
        .lang-progress-card {
            background: var(--bg-card); border: var(--border-primary); border-radius: 8px;
            padding: 20px; margin-top: 20px;
        }
        .lang-progress-title { margin: 0 0 16px 0; font-size: 18px; font-weight: bold; }
        .lang-row { display: flex; align-items: center; gap: 14px; padding: 10px 0; }
        .lang-row + .lang-row { border-top: 1px solid var(--border-color); }
        .lang-row-icon { width: 32px; height: 32px; object-fit: contain; flex-shrink: 0; }
        .lang-row-main { flex: 1; min-width: 0; }
        .lang-row-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 6px; }
        .lang-row-name { font-size: 15px; font-weight: bold; color: var(--text-white); }
        .lang-row-count { font-size: 13px; color: var(--text-secondary); white-space: nowrap; }
        .lang-row .progress { height: 6px; }
        .lang-row.idle .lang-row-name, .lang-row.idle .lang-row-count { opacity: 0.55; }
    </style>
</head>
<body>
<div id="app-container">
    <div class="titlebar">
        <div class="titlebar-left"><img src="icons/python.svg" class="titlebar-icon" alt="Icon"></div>
        <div class="titlebar-right">
            <button class="titlebar-btn" onclick="pywebview.api.minimize_window()">—</button>
            <button class="titlebar-btn" onclick="pywebview.api.toggle_maximize()">□</button>
            <button class="titlebar-btn btn-close" onclick="pywebview.api.close_window()">✕</button>
        </div>
    </div>

    <div class="layout">
        <aside class="sidebar-main">
            <a class="sidebar-logo" href="index.html">
                <img src="icons/logo.png" alt="Logo" width="80" height="80" onerror="this.style.display='none'">
                <span class="sidebar-logo-text">CodeQuest</span>
            </a>
            <nav class="sidebar-scroll">
                <section class="sidebar-group">
                    <h2 class="sidebar-group-label" data-i18n="nav_learn">Учёба</h2>
                    <a class="sidebar-item" href="index.html"><img src="icons/journey.svg" width="28" height="28" alt=""><span data-i18n="nav_path">Путь</span></a>
                    <a class="sidebar-item" href="cheatsheet.html"><img src="icons/sprav.svg" width="28" height="28" alt=""><span data-i18n="nav_cheatsheet">Справочник</span></a>
                    <a class="sidebar-item" href="achievements.html"><img src="icons/achievement.svg" width="28" height="28" alt=""><span data-i18n="nav_achievements">Достижения</span></a>
                </section>
            </nav>
            <div class="sidebar-footer">
                <a class="sidebar-item sidebar-item-active" href="profile.html"><img src="icons/profile.svg" width="28" height="28" alt=""><span data-i18n="nav_profile">Профиль</span><span class="sidebar-dot"></span></a>
                <a class="sidebar-item" href="settings.html"><img src="icons/settings.svg" width="28" height="28" alt=""><span data-i18n="nav_settings">Настройки</span></a>
            </div>
        </aside>

        <main class="main">
            <header class="main-header">
                <div class="main-header-text">
                    <nav class="breadcrumbs"><span class="breadcrumbs-current" data-i18n="profile_subtitle">Личный кабинет</span></nav>
                    <h1 class="main-title" data-i18n="profile_title">Профиль</h1>
                </div>
            </header>

            <div class="main-body">
                <div class="profile-card">
                    <div class="profile-header">
                        <div class="profile-avatar" onclick="document.getElementById('avatar-upload').click()" title="Нажми, чтобы сменить аватар">
                            <span id="avatar-placeholder">👤</span>
                            <img id="avatar-image" alt="Аватар">
                            <div class="profile-avatar-overlay">📷</div>
                        </div>
                        <input type="file" id="avatar-upload" accept="image/*" style="display: none;">
                        <div class="profile-info">
                            <h2 id="profile-name">Ученик</h2>
                            <p id="profile-learning">Изучает</p>
                        </div>
                    </div>
                    <div class="profile-stats" id="profile-stats"></div>
                </div>

                <div class="lang-progress-card">
                    <h3 class="lang-progress-title" data-i18n="profile_lang_progress">Прогресс по языкам</h3>
                    <div id="lang-progress-list"></div>
                </div>
            </div>
        </main>

        <aside class="right-panel">
            <div class="stats-bar" style="justify-content: flex-start;">
                <button class="stat-item stat-streak" id="streak-widget">
                    <span class="stat-val" id="streak-count">0</span><span id="streak-icon" style="font-size: 18px;">🔥</span>
                </button>
            </div>
        </aside>
    </div>
</div>

<script>
    window.addEventListener('pywebviewready', async () => {
        await applyLanguage();
        try {
            const data = await pywebview.api.load_data();

            // Применяем тему (если выбрана светлая)
            if (data.settings_app_theme === 'light') {
                document.body.classList.add('light-theme');
            }

            if (data.username) {
                document.getElementById('profile-name').textContent = data.username;
            }
            if (data.user_avatar) {
                const img = document.getElementById('avatar-image');
                img.src = data.user_avatar; img.style.display = 'block';
                document.getElementById('avatar-placeholder').style.display = 'none';
            }
            document.getElementById('avatar-upload').addEventListener('change', function(e) {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const maxSize = 150; let width = img.width, height = img.height;
                        if (width > height) { if (width > maxSize) { height *= maxSize / width; width = maxSize; } }
                        else { if (height > maxSize) { width *= maxSize / height; height = maxSize; } }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);
                        pywebview.api.save_key('user_avatar', compressedBase64).then(() => {
                            const avImg = document.getElementById('avatar-image');
                            avImg.src = compressedBase64; avImg.style.display = 'block';
                            document.getElementById('avatar-placeholder').style.display = 'none';
                        });
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
            // Счётчики считаем по активному курсу: раньше в них попадали все языки сразу.
            const activeLang = await pywebview.api.get_active_lang();
            const langStats = await pywebview.api.get_lang_stats();
            const allStats = await pywebview.api.get_all_lang_stats();

            const learningEl = document.getElementById('profile-learning');
            if (learningEl) {
                learningEl.textContent = `${t('profile_learning')}: ${langStats.name}`;
            }

            // Огонёк общий для всех курсов, поэтому берём его из get_streak_status.
            const streakStatus = await pywebview.api.get_streak_status();
            const timeStats = await pywebview.api.get_time_stats();
            document.getElementById('profile-stats').innerHTML = `
        <div class="stat-box"><div class="val">${streakStatus.streak}</div><div class="label" data-i18n="stats_days">Дней подряд</div></div>
        <div class="stat-box"><div class="val">${langStats.lessons_done}</div><div class="label" data-i18n="stats_lessons">Уроков пройдено</div></div>
        <div class="stat-box"><div class="val">${langStats.trophies_done}</div><div class="label" data-i18n="stats_trophies">Контрольных сдано</div></div>
        <div class="stat-box"><div class="val">${timeStats.today_minutes}</div><div class="label" data-i18n="stats_time_today">Мин. сегодня</div></div>
        <div class="stat-box"><div class="val">${timeStats.week_minutes}</div><div class="label" data-i18n="stats_time_week">Мин. за неделю</div></div>`;

            const langIcons = {
                "python": "icons/python.svg", "java": "icons/java.svg", "cpp": "icons/cplusplus.svg",
                "c": "icons/c.svg", "javascript": "icons/javascript.svg", "html": "icons/html.svg",
                "css": "icons/css.svg", "prog": "icons/prog.svg"
            };
            document.getElementById('lang-progress-list').innerHTML = allStats.map(s => {
                const percent = s.total > 0 ? (s.done / s.total) * 100 : 0;
                return `<div class="lang-row ${s.done === 0 ? 'idle' : ''}">
                    <img class="lang-row-icon" src="${langIcons[s.lang] || 'icons/prog.svg'}" alt="" onerror="this.style.display='none'">
                    <div class="lang-row-main">
                        <div class="lang-row-head">
                            <span class="lang-row-name">${s.name}</span>
                            <span class="lang-row-count">${s.done} / ${s.total}</span>
                        </div>
                        <div class="progress"><div class="progress-fill" style="width: ${percent}%; background: var(--product-xp-color);"></div></div>
                    </div>
                </div>`;
            }).join('');

            await applyLanguage();
            const status = await pywebview.api.get_streak_status();
            document.getElementById('streak-count').textContent = status.streak;
            const icon = document.getElementById('streak-icon');
            const widget = document.getElementById('streak-widget');
            if (status.frozen) { icon.style.filter = 'hue-rotate(180deg)'; if (widget) widget.title = t('streak_frozen_hint'); }
            else if (status.streak > 0) icon.style.filter = 'none';
            else icon.style.filter = 'grayscale(100%)';
        } catch (e) { console.error(e); }
    });
</script>
</body>
</html>
