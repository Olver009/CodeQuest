<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="update.js"></script>
    <meta charset="utf-8">
    <title>Справочник - CodeQuest</title>
    <link rel="stylesheet" href="style.css">
    <script src="i18n.js"></script>
    <script src="drag.js"></script>
    <script src="vendor/marked/marked.min.js"></script>
    <link rel="stylesheet" href="vendor/highlight/styles/vs2015.min.css">
    <script src="vendor/highlight/highlight.min.js"></script>
    <script src="vendor/highlight/languages/python.min.js"></script>

    <style>
        .cheat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; margin-top: 20px; }
        .cheat-card {
            background: var(--bg-card); border: var(--border-primary); border-radius: 8px; padding: 20px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .cheat-card h3 { margin: 0; color: var(--brand-bright); font-size: 18px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .cheat-content { font-size: 14px; color: var(--text-primary); line-height: 1.5; }
        .cheat-content p { margin-bottom: 8px; }
        .cheat-content code { background: var(--bg-code-secondary); padding: 2px 6px; border-radius: 4px; font-family: Consolas, monospace; color: #ce9178; }
        .cheat-content pre { background: #1e1e1e; padding: 12px; border-radius: 6px; overflow-x: auto; border: 1px solid var(--border-color); }

        .empty-state { text-align: center; color: var(--text-secondary); margin-top: 50px; font-size: 16px; }
    </style>
</head>
<body>
<div id="app-container">
    <div class="titlebar">
        <div class="titlebar-left"><img src="icons/python.svg" class="titlebar-icon" alt="Icon"></div>
        <div class="titlebar-right">
            <button class="titlebar-btn" onclick="pywebview.api.minimize_window()">—</button>
            <button class="titlebar-btn" onclick="pywebview.api.toggle_maximize()">□</button>
            <button class="titlebar-btn btn-close" onclick="pywebview.api.close_window()">✕</button>
        </div>
    </div>

    <div class="layout">
        <aside class="sidebar-main">
            <a class="sidebar-logo" href="index.html">
                <img src="icons/logo.png" alt="Logo" width="80" height="80" onerror="this.style.display='none'">
                <span class="sidebar-logo-text">CodeQuest</span>
            </a>
            <nav class="sidebar-scroll">
                <section class="sidebar-group">
                    <h2 class="sidebar-group-label" data-i18n="nav_learn">Учёба</h2>
                    <a class="sidebar-item" href="index.html"><img src="icons/journey.svg" width="28" height="28" alt=""><span data-i18n="nav_path">Путь</span></a>
                    <a class="sidebar-item sidebar-item-active" href="cheatsheet.html"><img src="icons/sprav.svg" width="28" height="28" alt=""><span data-i18n="nav_cheatsheet">Справочник</span><span class="sidebar-dot"></span></a>
                    <a class="sidebar-item" href="achievements.html"><img src="icons/achievement.svg" width="28" height="28" alt=""><span data-i18n="nav_achievements">Достижения</span></a>
                </section>
            </nav>
            <div class="sidebar-footer">
                <a class="sidebar-item" href="profile.html"><img src="icons/profile.svg" width="28" height="28" alt=""><span data-i18n="nav_profile">Профиль</span></a>
                <a class="sidebar-item" href="settings.html"><img src="icons/settings.svg" width="28" height="28" alt=""><span data-i18n="nav_settings">Настройки</span></a>
            </div>
        </aside>

        <main class="main">
            <header class="main-header">
                <div class="main-header-text">
                    <nav class="breadcrumbs"><span class="breadcrumbs-current" data-i18n="nav_cheatsheet">Справочник</span></nav>
                    <h1 class="main-title" data-i18n="nav_cheatsheet">Справочник</h1>
                </div>
            </header>
            <div class="main-body" id="cheat-container">
                <!-- Сюда загрузятся карточки -->
            </div>
        </main>
        <aside class="right-panel"></aside>
    </div>
</div>

<script>
    window.addEventListener('pywebviewready', async () => {
        await applyLanguage();
        const progress = await pywebview.api.load_data();

        // Применяем тему (если выбрана светлая)
        if (progress.settings_app_theme === 'light') {
            document.body.classList.add('light-theme');
        }

        const roadmap = await pywebview.api.get_roadmap();
        const activeLang = await pywebview.api.get_active_lang();
        const langIcons = {
            "python": "icons/python.svg", "java": "icons/java.svg", "cpp": "icons/cplusplus.svg",
            "c": "icons/c.svg", "javascript": "icons/javascript.svg", "html": "icons/html.svg",
            "css": "icons/css.svg", "prog": "icons/prog.svg"
        };
        document.querySelector('.titlebar-icon').src = langIcons[activeLang] || "icons/python.svg";

        const container = document.getElementById('cheat-container');

        // Собираем ID пройденных уроков только текущего языка
        const lessonPrefix = `${activeLang}_status_`;
        const trophyPrefix = `${activeLang}_status_trophy_`;
        let completedLessonIds = [];
        for (const key in progress) {
            if (key.startsWith(lessonPrefix) && !key.startsWith(trophyPrefix) && progress[key] === 'done') {
                completedLessonIds.push(parseInt(key.slice(lessonPrefix.length)));
            }
        }

        if (completedLessonIds.length === 0) {
            container.innerHTML = `<div class="empty-state">Вы еще не прошли ни одного урока.<br>Пройдите первый урок, и его теория появится здесь!</div>`;
            return;
        }

        let cardsHTML = '<div class="cheat-grid">';

        // Проходимся по roadmap, чтобы сохранить порядок уроков
        for (const chapter of roadmap) {
            for (const lesson of chapter.lessons) {
                if (completedLessonIds.includes(parseInt(lesson.id))) {
                    // Загружаем полные данные урока, чтобы достать теорию
                    const fullLesson = await pywebview.api.get_lesson(lesson.id);
                    if (fullLesson && fullLesson.theory) {
                        const theoryHTML = marked.parse(fullLesson.theory);
                        cardsHTML += `
                        <div class="cheat-card">
                            <h3>${lesson.title}</h3>
                            <div class="cheat-content">${theoryHTML}</div>
                        </div>
                    `;
                    }
                }
            }
        }

        cardsHTML += '</div>';
        container.innerHTML = cardsHTML;

        // Подсвечиваем код в справочнике
        container.querySelectorAll('pre code').forEach((block) => {
            hljs.highlightElement(block);
        });
    });
</script>
</body>
</html>
