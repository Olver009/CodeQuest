<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="update.js"></script>
    <meta charset="utf-8">
    <title>Достижения - CodeQuest</title>
    <link rel="stylesheet" href="style.css">
    <script src="i18n.js"></script>
    <script src="drag.js"></script>
    <style>
        .ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .ach-card {
            background: var(--bg-card); border: var(--border-primary); border-radius: 8px; padding: 24px;
            display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; transition: all 0.3s;
        }
        .ach-card.locked { opacity: 0.4; filter: grayscale(100%); }
        .ach-icon-box {
            width: 80px; height: 80px; border-radius: 50%; background: var(--bg-code-secondary);
            display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--border-color); margin-bottom: 8px;
        }
        .ach-icon { width: 48px; height: 48px; object-fit: contain; }
        .ach-card.unlocked .ach-icon-box { border-color: var(--brand-bright); box-shadow: 0 0 15px rgba(41, 171, 226, 0.3); }
        .ach-title { font-size: 18px; font-weight: bold; margin: 0; color: var(--text-primary); }
        .ach-desc { font-size: 14px; color: var(--text-secondary); margin: 0; line-height: 1.4; }
        .ach-status { font-size: 12px; font-weight: bold; margin-top: 8px; padding: 6px 12px; border-radius: 12px; }
        .ach-card.unlocked .ach-status { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .ach-card.locked .ach-status { background: rgba(255,255,255,0.1); color: var(--text-secondary); }
        .ach-section { margin-top: 32px; }
        .ach-section-head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
        .ach-section-title { font-size: 20px; font-weight: bold; margin: 0; color: var(--text-white); }
        .ach-section-count { font-size: 13px; color: var(--text-secondary); background: var(--bg-code-secondary); padding: 4px 10px; border-radius: 10px; }
        .ach-section-sub { margin: 0; font-size: 14px; color: var(--text-secondary); }
        .ach-empty { color: var(--text-secondary); margin-top: 20px; }
    </style>
</head>
<body>
<div id="app-container">
    <div class="titlebar">
        <div class="titlebar-left"><img src="icons/python.svg" class="titlebar-icon" alt="Icon"></div>
        <div class="titlebar-right">
            <button class="titlebar-btn" onclick="pywebview.api.minimize_window()">—</button>
            <button class="titlebar-btn" onclick="pywebview.api.toggle_maximize()">□</button>
            <button class="titlebar-btn btn-close" onclick="pywebview.api.close_window()">✕</button>
        </div>
    </div>

    <div class="layout">
        <aside class="sidebar-main">
            <a class="sidebar-logo" href="index.html">
                <img src="icons/logo.png" alt="Logo" width="80" height="80" onerror="this.style.display='none'">
                <span class="sidebar-logo-text">CodeQuest</span>
            </a>
            <nav class="sidebar-scroll">
                <section class="sidebar-group">
                    <h2 class="sidebar-group-label" data-i18n="nav_learn">Учёба</h2>
                    <a class="sidebar-item" href="index.html"><img src="icons/journey.svg" width="28" height="28" alt=""><span data-i18n="nav_path">Путь</span></a>
                    <a class="sidebar-item" href="cheatsheet.html"><img src="icons/sprav.svg" width="28" height="28" alt=""><span data-i18n="nav_cheatsheet">Справочник</span></a>
                    <a class="sidebar-item sidebar-item-active" href="achievements.html"><img src="icons/achievement.svg" width="28" height="28" alt=""><span data-i18n="nav_achievements">Достижения</span><span class="sidebar-dot"></span></a>
                </section>
            </nav>
            <div class="sidebar-footer">
                <a class="sidebar-item" href="profile.html"><img src="icons/profile.svg" width="28" height="28" alt=""><span data-i18n="nav_profile">Профиль</span></a>
                <a class="sidebar-item" href="settings.html"><img src="icons/settings.svg" width="28" height="28" alt=""><span data-i18n="nav_settings">Настройки</span></a>
            </div>
        </aside>

        <main class="main" style="overflow-y: auto;">
            <header class="main-header">
                <div class="main-header-text">
                    <nav class="breadcrumbs"><span class="breadcrumbs-current" data-i18n="nav_achievements">Достижения</span></nav>
                    <h1 class="main-title" data-i18n="nav_achievements">Достижения</h1>
                </div>
            </header>
            <div class="main-body" id="ach-container"></div>
        </main>
        <aside class="right-panel"></aside>
    </div>
</div>

<script>
    function achCard(a, isUnlocked) {
        return `
        <div class="ach-card ${isUnlocked ? 'unlocked' : 'locked'}">
            <div class="ach-icon-box">
                <img src="icons/${a.icon}" class="ach-icon" onerror="this.src='icons/lesson-all.svg'">
            </div>
            <h3 class="ach-title" data-i18n="${a.id}">${a.id}</h3>
            <p class="ach-desc" data-i18n="${a.id}_desc">${a.id}_desc</p>
            <span class="ach-status" data-i18n="${isUnlocked ? 'ach_unlocked' : 'ach_locked'}">${isUnlocked ? 'Получено' : 'Не получено'}</span>
        </div>`;
    }

    function section(titleKey, subtitle, items, unlocked, emptyKey) {
        if (!items || items.length === 0) {
            return `<section class="ach-section">
                <div class="ach-section-head"><h2 class="ach-section-title" data-i18n="${titleKey}">${titleKey}</h2></div>
                <p class="ach-empty" data-i18n="${emptyKey}">${emptyKey}</p>
            </section>`;
        }
        const got = items.filter(a => unlocked.includes(a.id)).length;
        return `<section class="ach-section">
            <div class="ach-section-head">
                <h2 class="ach-section-title" data-i18n="${titleKey}">${titleKey}</h2>
                <span class="ach-section-count">${got} / ${items.length}</span>
            </div>
            <p class="ach-section-sub">${subtitle}</p>
            <div class="ach-grid">${items.map(a => achCard(a, unlocked.includes(a.id))).join('')}</div>
        </section>`;
    }

    window.addEventListener('pywebviewready', async () => {
        await applyLanguage();

        const data = await pywebview.api.load_data();
        if (data.settings_app_theme === 'light') {
            document.body.classList.add('light-theme');
        }

        const activeLang = await pywebview.api.get_active_lang();
        const langIcons = {
            "python": "icons/python.svg", "java": "icons/java.svg", "cpp": "icons/cplusplus.svg",
            "c": "icons/c.svg", "javascript": "icons/javascript.svg", "html": "icons/html.svg",
            "css": "icons/css.svg", "prog": "icons/prog.svg"
        };
        document.querySelector('.titlebar-icon').src = langIcons[activeLang] || "icons/python.svg";

        // Каталог и уже выданные награды приходят с бэкенда: списки не дублируются в JS.
        const catalog = await pywebview.api.get_achievement_catalog();
        const unlocked = await pywebview.api.get_unlocked_achievements();
        const langStats = await pywebview.api.get_lang_stats();

        const container = document.getElementById('ach-container');
        const langTitle = `${t('ach_section_lang')}: ${catalog.lang_name}`;
        const langSub = `${t('ach_progress_prefix')}: ${langStats.lessons_done} / ${langStats.lessons_total}` +
            ` · ${t('stats_trophies')}: ${langStats.trophies_done} / ${langStats.trophies_total}`;

        container.innerHTML =
            section('ach_section_lang', langSub, catalog.lang_achievements, unlocked.lang || [], 'ach_empty_lang') +
            section('ach_section_global', t('ach_section_global_sub'), catalog.global_achievements, unlocked.global || [], 'ach_empty_global');

        // Название секции языка зависит от активного курса — подставляем вручную.
        const langHeader = container.querySelector('.ach-section-title');
        if (langHeader) langHeader.textContent = langTitle;

        await applyLanguage();
        if (langHeader) langHeader.textContent = langTitle;
    });
</script>
</body>
</html>
