<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Достижения - CodeQuest</title>
    <link rel="stylesheet" href="style.css">
    <script src="i18n.js"></script>
    <script src="drag.js"></script>
    <style>
        .ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .ach-card {
            background: var(--bg-card); border: var(--border-primary); border-radius: 8px; padding: 24px;
            display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; transition: all 0.3s;
        }
        .ach-card.locked { opacity: 0.4; filter: grayscale(100%); }
        .ach-icon-box {
            width: 80px; height: 80px; border-radius: 50%; background: var(--bg-code-secondary);
            display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--border-color); margin-bottom: 8px;
        }
        .ach-icon { width: 48px; height: 48px; object-fit: contain; }
        .ach-card.unlocked .ach-icon-box { border-color: var(--brand-bright); box-shadow: 0 0 15px rgba(41, 171, 226, 0.3); }
        .ach-title { font-size: 18px; font-weight: bold; margin: 0; color: var(--text-primary); }
        .ach-desc { font-size: 14px; color: var(--text-secondary); margin: 0; line-height: 1.4; }
        .ach-status { font-size: 12px; font-weight: bold; margin-top: 8px; padding: 6px 12px; border-radius: 12px; }
        .ach-card.unlocked .ach-status { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .ach-card.locked .ach-status { background: rgba(255,255,255,0.1); color: var(--text-secondary); }
    </style>
</head>
<body>
<div id="app-container">
    <div class="titlebar">
        <div class="titlebar-left"><img src="icons/python.svg" class="titlebar-icon" alt="Icon"></div>
        <div class="titlebar-right">
            <button class="titlebar-btn" onclick="pywebview.api.minimize_window()">—</button>
            <button class="titlebar-btn" onclick="pywebview.api.toggle_maximize()">□</button>
            <button class="titlebar-btn btn-close" onclick="pywebview.api.close_window()">✕</button>
        </div>
    </div>

    <div class="layout">
        <aside class="sidebar-main">
            <a class="sidebar-logo" href="index.html">
                <img src="icons/logo.png" alt="Logo" width="80" height="80" onerror="this.style.display='none'">
                <span class="sidebar-logo-text">CodeQuest</span>
            </a>
            <nav class="sidebar-scroll">
                <section class="sidebar-group">
                    <h2 class="sidebar-group-label" data-i18n="nav_learn">Учёба</h2>
                    <a class="sidebar-item" href="index.html"><img src="icons/journey.svg" width="28" height="28" alt=""><span data-i18n="nav_path">Путь</span></a>
                    <a class="sidebar-item" href="cheatsheet.html"><img src="icons/sprav.svg" width="28" height="28" alt=""><span data-i18n="nav_cheatsheet">Справочник</span></a>
                    <a class="sidebar-item sidebar-item-active" href="achievements.html"><img src="icons/achievement.svg" width="28" height="28" alt=""><span data-i18n="nav_achievements">Достижения</span><span class="sidebar-dot"></span></a>
                </section>
            </nav>
            <div class="sidebar-footer">
                <a class="sidebar-item" href="profile.html"><img src="icons/profile.svg" width="28" height="28" alt=""><span data-i18n="nav_profile">Профиль</span></a>
                <a class="sidebar-item" href="settings.html"><img src="icons/settings.svg" width="28" height="28" alt=""><span data-i18n="nav_settings">Настройки</span></a>
            </div>
        </aside>

        <main class="main" style="overflow-y: auto;">
            <header class="main-header">
                <div class="main-header-text">
                    <nav class="breadcrumbs"><span class="breadcrumbs-current" data-i18n="nav_achievements">Достижения</span></nav>
                    <h1 class="main-title" data-i18n="nav_achievements">Достижения</h1>
                </div>
            </header>
            <div class="main-body" id="ach-container"></div>
        </main>
        <aside class="right-panel"></aside>
    </div>
</div>

<script>
    window.addEventListener('pywebviewready', async () => {
        await applyLanguage();

        // Получаем текущий язык и данные
        const activeLang = await pywebview.api.get_active_lang();
        const data = await pywebview.api.load_data();
        const roadmap = await pywebview.api.get_roadmap(); // Берет roadmap для активного языка

        // Собираем ID уроков и КР именно для ЭТОГО языка
        let currentLangLessonIds = [];
        let currentLangTrophyIds = [];

        if (roadmap && Array.isArray(roadmap)) {
            roadmap.forEach(chapter => {
                chapter.lessons.forEach(l => currentLangLessonIds.push(String(l.id)));
                if (chapter.trophy) currentLangTrophyIds.push(String(chapter.id));
            });
        }

        // Считаем прогресс только по урокам текущего языка
        let doneLessons = 0;
        let doneTrophies = 0;

        currentLangLessonIds.forEach(id => {
            if (data[`status_${id}`] === 'done') doneLessons++;
        });
        currentLangTrophyIds.forEach(id => {
            if (data[`status_trophy_${id}`] === 'done') doneTrophies++;
        });

        // Настройки достижений для разных языков
        const achievementsData = {
            "python": [
                { icon: 'ach-start.svg', titleKey: 'ach_py_start', descKey: 'ach_py_start_desc', unlocked: doneLessons >= 1 },
                { icon: 'ach-learner.svg', titleKey: 'ach_py_ten', descKey: 'ach_py_ten_desc', unlocked: doneLessons >= 10 },
                { icon: 'ach-master.svg', titleKey: 'ach_py_master', descKey: 'ach_py_master_desc', unlocked: doneLessons >= 50 },
                { icon: 'ach-test.svg', titleKey: 'ach_first_trophy', descKey: 'ach_first_trophy_desc', unlocked: doneTrophies >= 1 },
                { icon: 'ach-fire.svg', titleKey: 'ach_streak_3', descKey: 'ach_streak_3_desc', unlocked: (data.streak || 0) >= 3 },
                { icon: 'ach-star.svg', titleKey: 'ach_py_collector', descKey: 'ach_py_collector_desc', unlocked: doneTrophies >= 5 }
            ],
            "java": [
                { icon: 'ach-java.svg', titleKey: 'ach_java_start', descKey: 'ach_java_start_desc', unlocked: doneLessons >= 1 },
                { icon: 'ach-coffee.svg', titleKey: 'ach_java_coffee', descKey: 'ach_java_coffee_desc', unlocked: doneLessons >= 10 },
                { icon: 'ach-oop.svg', titleKey: 'ach_java_oop', descKey: 'ach_java_oop_desc', unlocked: doneLessons >= 30 },
                { icon: 'ach-fire.svg', titleKey: 'ach_streak_3', descKey: 'ach_streak_3_desc', unlocked: (data.streak || 0) >= 3 }
            ]
        };

        // Берем достижения для текущего языка, если нет — пустой массив
        const currentAchievements = achievementsData[activeLang] || achievementsData["python"];

        const container = document.getElementById('ach-container');
        container.innerHTML = `<div class="ach-grid">${currentAchievements.map(a => `
        <div class="ach-card ${a.unlocked ? 'unlocked' : 'locked'}">
            <div class="ach-icon-box">
                <img src="icons/${a.icon}" class="ach-icon" onerror="this.src='icons/lesson-all.svg'">
            </div>
            <h3 class="ach-title" data-i18n="${a.titleKey}">${a.titleKey}</h3>
            <p class="ach-desc" data-i18n="${a.descKey}">${a.descKey}</p>
            <span class="ach-status" data-i18n="${a.unlocked ? 'ach_unlocked' : 'ach_locked'}">${a.unlocked ? 'Получено' : 'Не получено'}</span>
        </div>`).join('')}</div>`;

        await applyLanguage();
    });
</script>
</body>
</html>
