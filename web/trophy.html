<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>CodeQuest</title>
    <link rel="stylesheet" href="style.css">
    <script src="i18n.js"></script>
    <script src="drag.js"></script>
    <script src="toast.js"></script>
    <link rel="stylesheet" href="vendor/codemirror/codemirror.min.css">
    <link rel="stylesheet" href="vendor/codemirror/theme/material-darker.min.css">
    <script src="vendor/codemirror/codemirror.min.js"></script>
    <script src="vendor/codemirror/mode/python/python.min.js"></script>
    <link rel="stylesheet" href="vendor/codemirror/addon/hint/show-hint.min.css">
    <script src="vendor/codemirror/addon/hint/show-hint.min.js"></script>
    <script src="vendor/marked/marked.min.js"></script>
    <link rel="stylesheet" href="vendor/highlight/styles/vs2015.min.css">
    <script src="vendor/highlight/highlight.min.js"></script>
    <script src="vendor/highlight/languages/python.min.js"></script>
    <link rel="stylesheet" href="vendor/xterm/xterm.css" />
    <script src="vendor/xterm/xterm.js"></script>
</head>
<body>
<div id="app-container">
    <div class="titlebar">
        <div class="titlebar-left"><img src="icons/python.svg" class="titlebar-icon" alt="Icon"></div>
        <div class="titlebar-right">
            <button class="titlebar-btn" onclick="pywebview.api.minimize_window()">—</button>
            <button class="titlebar-btn" onclick="pywebview.api.toggle_maximize()">□</button>
            <button class="titlebar-btn btn-close" onclick="pywebview.api.close_window()">✕</button>
        </div>
    </div>

    <div class="layout">
        <!-- УЗКАЯ ПАНЕЛЬ -->
        <aside class="sidebar-lesson">
            <button class="side-btn active">🏆</button>
        </aside>

        <main class="main" style="padding: 0; max-width: 100%; align-items: stretch; overflow: hidden;">
            <div class="lesson" style="height: 100%;">
                <header class="lesson-topbar">
                    <div class="topbar-left">
                        <a href="index.html" class="close-btn" style="text-decoration: none;">×</a>
                        <h1 class="lesson-title" id="lesson-title">Загрузка...</h1>
                    </div>
                    <div class="topbar-stats">
                        <div class="stat stat-streak" id="topbar-streak-widget"><span class="stat-icon" id="topbar-streak-icon">🔥</span><span class="stat-val" id="topbar-streak-count">0</span></div>
                    </div>
                </header>

                <div class="lesson-body">
                    <aside class="theory-panel" style="width: 500px;">
                        <div class="theory-header"><h2 class="theory-title" id="theory-title">Контрольная работа</h2></div>
                        <section class="challenge"><div class="theory-content" id="theory-content"></div></section>
                    </aside>

                    <main class="code-view">
                        <div id="editor-container" class="editor-container" style="display: flex;">
                            <div class="editor-toolbar">
                                <div class="lang-select">Python</div>
                                <button class="icon-btn" onclick="resetCode()">↺</button>
                            </div>
                            <div class="editor-area"><textarea id="code-editor"></textarea></div>
                            <div class="console-panel">
                                <div class="editor-actions-bottom">
                                    <button class="btn btn-run" id="run-btn" onclick="startTerminal()" data-i18n="lesson_run">▶ Запустить код</button>
                                    <button class="btn btn-run" id="stop-btn" onclick="stopTerminal()" style="display: none; background: #c53030;" data-i18n="lesson_stop">■ Стоп</button>
                                </div>
                                <div class="console-tabs"><button class="console-tab active" data-i18n="lesson_result">РЕЗУЛЬТАТ</button></div>
                                <div class="console-body">
                                    <div class="console-col"><div class="console-label" data-i18n="lesson_terminal">Терминал</div><div id="terminal-container"></div></div>
                                    <div class="console-divider"></div>
                                    <div class="console-col"><div class="console-label" data-i18n="lesson_expected">Ожидаемый вывод</div><pre class="console-pre" id="console-expected"></pre></div>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
    let trophyData = null, chapterId = null, editor = null, userData = {}, term = null, terminalOutput = "", lessonPassed = false;

    window.addEventListener('pywebviewready', async () => {
        await applyLanguage();
        const urlParams = new URLSearchParams(window.location.search);
        chapterId = urlParams.get('id') || 1;
        localStorage.setItem('lastVisitedNode', `node-trophy-${chapterId}`);
        try {
            updateStreakUI(); userData = await pywebview.api.load_data(); trophyData = await pywebview.api.get_trophy_test(chapterId);
            if (trophyData.error) throw new Error(trophyData.error);
            const fontSize = userData.settings_font_size || 15;
            document.documentElement.style.setProperty('--editor-font-size', fontSize + 'px');
            document.getElementById('lesson-title').textContent = trophyData.title;
            document.getElementById('theory-title').textContent = trophyData.title;
            const theoryDiv = document.getElementById('theory-content'); theoryDiv.innerHTML = marked.parse(trophyData.practice.description || '');
            theoryDiv.querySelectorAll('pre code').forEach((block) => { hljs.highlightElement(block); });
            document.getElementById('console-expected').textContent = trophyData.practice.expected;
            initTerminal();
            editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), { mode: 'python', lineNumbers: true, indentUnit: 4, theme: 'material-darker', viewportMargin: Infinity, extraKeys: {"Ctrl-Space": "autocomplete"} });
            const savedCode = userData[`code_trophy_${chapterId}`]; editor.setValue(savedCode || trophyData.practice.starter);
            let saveTimeout; editor.on('change', () => { clearTimeout(saveTimeout); saveTimeout = setTimeout(() => { pywebview.api.save_key(`code_trophy_${chapterId}`, editor.getValue()); }, 500); });
        } catch (e) { document.getElementById('theory-content').textContent = "Ошибка: " + e.message; }
    });

    function initTerminal() {
        term = new Terminal({ cursorBlink: true, theme: { background: '#1e1e1e', foreground: '#d4d4d4', cursor: '#4ec9b0', selection: '#264f78' }, fontFamily: 'Consolas, monospace', fontSize: parseInt(userData.settings_font_size || 15) });
        term.open(document.getElementById('terminal-container'));
        term.onData(data => { if (window.pywebview) pywebview.api.send_input_to_pty(data); });
        window.writeToTerminal = (data) => { term.write(data); terminalOutput += data; checkResultInstant(); };
        window.terminalProcessEnded = () => { document.getElementById('run-btn').style.display = 'inline-flex'; document.getElementById('stop-btn').style.display = 'none'; checkResultEnd(); };
    }

    function playSuccessSound() {
        if (userData.settings_sound === false) return;
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1046.50, ctx.currentTime); // Нота C6 (звонкая)
            gain.gain.setValueAtTime(0.5, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6); // Плавное затухание
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.6);
        } catch(e) {}
    }

    function cleanTerminalOutput(text) {
        if (!text) return "";
        let clean = text.replace(/\x1b\[[0-9;?]*[a-zA-Z]/g, '').replace(/\x1b\][^\x07]*\x07/g, '').replace(/\x1b[()][A-Z0-9]/g, '').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, '');
        return clean.split('\n').map(l => l.trim()).filter(l => l.length > 0).join('\n');
    }

    function checkResultInstant() {
        if (lessonPassed || !trophyData || !trophyData.practice) return;
        const expected = cleanTerminalOutput(trophyData.practice.expected); if (expected.length === 0) return;
        const actualLines = cleanTerminalOutput(terminalOutput).split('\n'), expectedLines = expected.split('\n'); let matchIndex = 0;
        for (let i = 0; i < actualLines.length; i++) {
            if (actualLines[i] === expectedLines[matchIndex]) {
                matchIndex++;
                if (matchIndex === expectedLines.length) {
                    lessonPassed = true;
                    if (!userData[`status_trophy_${chapterId}`]) {
                        pywebview.api.save_key(`status_trophy_${chapterId}`, 'done').then(() => {
                            userData[`status_trophy_${chapterId}`] = 'done';
                            updateStreakUI();
                            playSuccessSound();
                            term.write('\r\n\x1b[32m✅ Отлично! Контрольная засчитана.\x1b[0m\r\n');

                            pywebview.api.check_achievements().then(newAchs => {
                                if (newAchs && newAchs.length > 0) {
                                    playAchievementSound();
                                    newAchs.forEach(ach => {
                                        showToast(t('ach_unlocked') + ': ' + t(ach), 'success');
                                    });
                                }
                            });
                        });
                    } else term.write('\r\n\x1b[32m✅ Вывод верный.\x1b[0m\r\n');
                    return;
                }
            } else if (matchIndex > 0) matchIndex = 0;
        }
        if (actualLines.length > expectedLines.length + 5) { lessonPassed = true; term.write('\r\n\x1b[33m⚠ Вывод не совпадает с ожидаемым.\x1b[0m\r\n'); }
    }

    function checkResultEnd() {
        if (lessonPassed || !trophyData || !trophyData.practice) return;
        const expected = cleanTerminalOutput(trophyData.practice.expected), actual = cleanTerminalOutput(terminalOutput);
        if (actual === expected && expected.length > 0) checkResultInstant();
        else if (actual.length > 0) term.write('\r\n\x1b[33m⚠ Вывод не совпадает с ожидаемым.\x1b[0m\r\n');
    }

    async function startTerminal() {
        const code = editor.getValue(); term.reset(); terminalOutput = ""; lessonPassed = false;
        document.getElementById('run-btn').style.display = 'none'; document.getElementById('stop-btn').style.display = 'inline-flex';
        const result = await pywebview.api.start_interactive_code(code);
        if (result.error) { term.write('Ошибка: ' + result.error + '\r\n'); document.getElementById('run-btn').style.display = 'inline-flex'; document.getElementById('stop-btn').style.display = 'none'; }
    }

    function stopTerminal() { pywebview.api.stop_interactive_code(); document.getElementById('run-btn').style.display = 'inline-flex'; document.getElementById('stop-btn').style.display = 'none'; }

    async function updateStreakUI() {
        try {
            const status = await pywebview.api.get_streak_status(); document.getElementById('topbar-streak-count').textContent = status.streak;
            const icon = document.getElementById('topbar-streak-icon'), widget = document.getElementById('topbar-streak-widget');
            if (status.frozen) { icon.style.filter = 'hue-rotate(180deg)'; widget.style.opacity = '1'; }
            else if (status.streak > 0) { icon.style.filter = 'none'; widget.style.opacity = '1'; }
            else { icon.style.filter = 'grayscale(100%)'; widget.style.opacity = '0.5'; }
        } catch(e) {}
    }

    function resetCode() {
        if (editor && trophyData) { editor.setValue(trophyData.practice.starter); pywebview.api.save_key(`code_trophy_${chapterId}`, trophyData.practice.starter); }
    }
    window.addEventListener('resize', () => { if (editor) editor.refresh(); if (term) term.refresh(0, term.rows - 1); });
</script>
</body>
</html>
