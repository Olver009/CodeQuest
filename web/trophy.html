<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>CodeQuest</title>
    <link rel="stylesheet" href="style.css">
    <script src="i18n.js"></script>
    <script src="drag.js"></script>
    <script src="toast.js"></script>
    <link rel="stylesheet" href="vendor/codemirror/codemirror.min.css">
    <link rel="stylesheet" href="vendor/codemirror/theme/material-darker.min.css">
    <link rel="stylesheet" href="vendor/codemirror/theme/dracula.min.css">
    <link rel="stylesheet" href="vendor/codemirror/theme/monokai.min.css">
    <script src="vendor/codemirror/codemirror.min.js"></script>
    <script src="vendor/codemirror/mode/python/python.min.js"></script>
    <script src="vendor/codemirror/mode/clike/clike.min.js"></script>
    <script src="vendor/codemirror/mode/javascript/javascript.min.js"></script>
    <script src="vendor/codemirror/mode/xml/xml.min.js"></script>
    <script src="vendor/codemirror/mode/css/css.min.js"></script>
    <script src="vendor/codemirror/mode/htmlmixed/htmlmixed.min.js"></script>
    <link rel="stylesheet" href="vendor/codemirror/addon/hint/show-hint.min.css">
    <script src="vendor/codemirror/addon/hint/show-hint.min.js"></script>
    <script src="vendor/codemirror/addon/edit/closebrackets.min.js"></script>
    <script src="vendor/codemirror/addon/edit/matchbrackets.min.js"></script>
    <script src="vendor/marked/marked.min.js"></script>
    <link rel="stylesheet" href="vendor/highlight/styles/vs2015.min.css">
    <script src="vendor/highlight/highlight.min.js"></script>
    <script src="vendor/highlight/languages/python.min.js"></script>
    <link rel="stylesheet" href="vendor/xterm/xterm.css" />
    <script src="vendor/xterm/xterm.js"></script>
    <style>
        .browser-preview {
            border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color);
            margin: 0 auto; background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; height: 100%; width: 100%;
        }
        .browser-header {
            background: #e5e7eb; padding: 8px 12px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #d1d5db;
        }
        .browser-dots { display: flex; gap: 6px; }
        .browser-dot { width: 10px; height: 10px; border-radius: 50%; }
        .browser-dot.red { background: #ef4444; }
        .browser-dot.yellow { background: #f59e0b; }
        .browser-dot.green { background: #10b981; }
        .browser-address {
            flex: 1; background: #f3f4f6; border-radius: 6px; padding: 4px 10px;
            font-size: 12px; color: #6b7280; font-family: monospace; text-align: center;
        }
        .browser-content { flex: 1; background: #fff; position: relative; }
        .browser-content iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        .cm-s-material-darker .cm-string, .cm-s-dracula .cm-string, .cm-s-monokai .cm-string { color: #98c379 !important; }
        .cm-s-material-darker .cm-keyword, .cm-s-dracula .cm-keyword, .cm-s-monokai .cm-keyword { color: #c678dd !important; font-weight: bold; }
        .cm-s-material-darker .cm-tag, .cm-s-dracula .cm-tag, .cm-s-monokai .cm-tag { color: #e06c75 !important; }
        .cm-s-material-darker .cm-attribute, .cm-s-dracula .cm-attribute, .cm-s-monokai .cm-attribute { color: #d19a66 !important; }
        .cm-s-material-darker .cm-number, .cm-s-dracula .cm-number, .cm-s-monokai .cm-number { color: #d19a66 !important; }
        .cm-s-material-darker .cm-comment, .cm-s-dracula .cm-comment, .cm-s-monokai .cm-comment { color: #5c6370 !important; font-style: italic; }
    </style>
</head>
<body>
<div id="app-container">
    <div class="titlebar">
        <div class="titlebar-left"><img src="icons/python.svg" class="titlebar-icon" alt="Icon"></div>
        <div class="titlebar-right">
            <button class="titlebar-btn" onclick="pywebview.api.minimize_window()">—</button>
            <button class="titlebar-btn" onclick="pywebview.api.toggle_maximize()">□</button>
            <button class="titlebar-btn btn-close" onclick="pywebview.api.close_window()">✕</button>
        </div>
    </div>

    <div class="layout">
        <aside class="sidebar-lesson">
            <button class="side-btn active">🏆</button>
        </aside>

        <main class="main" style="padding: 0; max-width: 100%; align-items: stretch; overflow: hidden;">
            <div class="lesson" style="height: 100%;">
                <header class="lesson-topbar">
                    <div class="topbar-left">
                        <a href="index.html" class="close-btn" style="text-decoration: none;">×</a>
                        <h1 class="lesson-title" id="lesson-title">Загрузка...</h1>
                    </div>
                    <div class="topbar-stats">
                        <div class="stat stat-streak" id="topbar-streak-widget"><span class="stat-icon" id="topbar-streak-icon">🔥</span><span class="stat-val" id="topbar-streak-count">0</span></div>
                    </div>
                </header>

                <div class="lesson-body">
                    <aside class="theory-panel" style="width: 500px;">
                        <div class="theory-header"><h2 class="theory-title" id="theory-title">Контрольная работа</h2></div>
                        <section class="challenge"><div class="theory-content" id="theory-content"></div></section>
                    </aside>

                    <main class="code-view">
                        <div id="quiz-container" class="quiz-container" style="display: none;">
                            <div class="editor-toolbar"><div class="lang-select" data-i18n="questions">Вопросы</div></div>
                            <div class="quiz-content">
                                <div class="quiz-progress" id="quiz-progress">
                                    <div class="quiz-progress-head">
                                        <span id="quiz-progress-label">Вопрос 1 из 6</span>
                                        <span id="quiz-progress-remaining">Осталось: 6 из 6</span>
                                    </div>
                                    <div class="quiz-progress-track"><div class="quiz-progress-fill" id="quiz-progress-fill"></div></div>
                                </div>
                                <h3 id="question-text" class="question-text"></h3>
                                <div id="options-container" class="options-container"></div>
                                <div id="quiz-feedback" class="quiz-feedback" style="display: none;"></div>
                                <button id="next-question-btn" class="btn btn-run" style="display: none; margin-top: 20px;" data-i18n="btn_next">Дальше</button>
                                <div id="quiz-complete" class="quiz-complete" style="display: none;">
                                    <div class="quiz-complete-icon">🏆</div>
                                    <h3 id="quiz-complete-title" data-i18n="trophy_complete_title">Контрольная сдана!</h3>
                                    <p id="quiz-complete-desc" data-i18n="trophy_complete_desc">Все вопросы контрольной решены.</p>
                                    <button class="btn btn-run" style="margin-top: 20px;" onclick="window.location.href='index.html'" data-i18n="quiz_back_to_lessons">К урокам</button>
                                </div>
                            </div>
                        </div>

                        <div id="editor-container" class="editor-container" style="display: flex;">
                            <div class="editor-toolbar">
                                <div class="lang-select" id="editor-lang-label">Python</div>
                                <button class="icon-btn" onclick="resetCode()">↺</button>
                            </div>

                            <div class="editor-area"><textarea id="code-editor"></textarea></div>

                            <div class="editor-actions-bottom" id="editor-actions-bottom" style="position: relative; bottom: 0; right: 0; padding: 8px 12px; justify-content: flex-end; background: var(--bg-code-primary); border-top: 1px solid var(--border-color); display: flex; gap: 12px;">
                                <button class="btn btn-run" id="run-btn" onclick="startTerminal()" data-i18n="lesson_run">▶ Запустить код</button>
                                <button class="btn btn-run" id="check-btn" onclick="checkWebTask()" style="display: none; background: #22c55e; font-size: 16px; padding: 0 24px; height: 44px; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);">✓ Проверить код</button>
                                <button class="btn btn-run" id="stop-btn" onclick="stopTerminal()" style="display: none; background: #c53030;" data-i18n="lesson_stop">■ Стоп</button>
                            </div>

                            <div id="preview-container" style="display: none; height: 260px; flex-shrink: 0; background: var(--bg-primary); border-top: 1px solid var(--border-color); padding: 12px;">
                                <div class="browser-preview">
                                    <div class="browser-header">
                                        <div class="browser-dots">
                                            <div class="browser-dot red"></div>
                                            <div class="browser-dot yellow"></div>
                                            <div class="browser-dot green"></div>
                                        </div>
                                        <div class="browser-address">localhost:3000</div>
                                    </div>
                                    <div class="browser-content">
                                        <iframe id="preview-frame"></iframe>
                                    </div>
                                </div>
                            </div>

                            <div class="console-panel" id="console-panel">
                                <div class="console-tabs"><button class="console-tab active" data-i18n="lesson_result">РЕЗУЛЬТАТ</button></div>
                                <div class="console-body">
                                    <div class="console-col"><div class="console-label" data-i18n="lesson_terminal">Терминал</div><div id="terminal-container"></div></div>
                                    <div class="console-divider"></div>
                                    <div class="console-col"><div class="console-label" data-i18n="lesson_expected">Ожидаемый вывод</div><pre class="console-pre" id="console-expected"></pre></div>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
    let trophyData = null, chapterId = null, editor = null, userData = {}, term = null, terminalOutput = "", lessonPassed = false, activeLang = "python", currentQuestionIndex = 0;
    let originalTrophyQuestions = [];
    let quizErrorCount = 0;
    window.addEventListener('pywebviewready', async () => {
        await applyLanguage();
        userData = await pywebview.api.load_data();

        if (userData.settings_app_theme === 'light') document.body.classList.add('light-theme');

        activeLang = await pywebview.api.get_active_lang();
        const langIcons = {
            "python": "icons/python.svg", "java": "icons/java.svg", "cpp": "icons/cplusplus.svg",
            "c": "icons/c.svg", "javascript": "icons/javascript.svg", "html": "icons/html.svg",
            "css": "icons/css.svg", "prog": "icons/prog.svg"
        };
        document.querySelector('.titlebar-icon').src = langIcons[activeLang] || "icons/python.svg";

        const urlParams = new URLSearchParams(window.location.search);
        chapterId = urlParams.get('id') || 1;
        localStorage.setItem('lastVisitedNode', `node-trophy-${chapterId}`);

        try {
            updateStreakUI();
            trophyData = await pywebview.api.get_trophy_test(chapterId);
            if (trophyData.error) throw new Error(trophyData.error);
            originalTrophyQuestions = JSON.parse(JSON.stringify(trophyData.questions || []));

            const fontSize = userData.settings_font_size || 15;
            document.documentElement.style.setProperty('--editor-font-size', fontSize + 'px');
            document.getElementById('lesson-title').textContent = trophyData.title;

            if (trophyData.quiz_only || (!trophyData.practice && trophyData.questions)) {
                document.getElementById('editor-container').style.display = 'none';
                document.getElementById('theory-title').textContent = trophyData.title;
                const infoDiv = document.getElementById('theory-content');
                infoDiv.innerHTML = marked.parse(trophyData.theory || trophyData.description || '');
                infoDiv.querySelectorAll('pre code').forEach((block) => { hljs.highlightElement(block); });

                if (userData[`${activeLang}_status_trophy_${chapterId}`] === 'done') {
                    showQuizComplete();
                } else {
                    startQuiz();
                }
                return;
            }

            document.getElementById('theory-title').textContent = trophyData.title;
            const theoryDiv = document.getElementById('theory-content'); theoryDiv.innerHTML = marked.parse(trophyData.practice.description || '');
            theoryDiv.querySelectorAll('pre code').forEach((block) => { hljs.highlightElement(block); });
            document.getElementById('console-expected').textContent = trophyData.practice.expected;

            initTerminal();

            const cmModes = {
                python: 'python', java: 'text/x-java', cpp: 'text/x-c++src',
                c: 'text/x-csrc', javascript: 'javascript', html: 'htmlmixed',
                css: 'css', prog: 'python'
            };
            const cmMode = cmModes[activeLang] || 'python';
            const edTheme = userData.settings_editor_theme || 'material-darker';

            const langNames = { "python": "Python", "java": "Java", "cpp": "C++", "c": "C", "javascript": "JavaScript", "html": "HTML", "css": "CSS", "prog": "General Code" };
            const langLabel = document.querySelector('#editor-container .lang-select');
            if (langLabel) langLabel.textContent = langNames[activeLang] || activeLang;

            if (activeLang === 'html' || activeLang === 'css') {
                document.getElementById('console-panel').style.display = 'none';
                document.getElementById('preview-container').style.display = 'block';
                document.getElementById('run-btn').style.display = 'none';
                document.getElementById('check-btn').style.display = 'inline-flex';
                document.getElementById('stop-btn').style.display = 'none';
            } else {
                document.getElementById('console-panel').style.display = 'flex';
                document.getElementById('preview-container').style.display = 'none';
                document.getElementById('run-btn').style.display = 'inline-flex';
                document.getElementById('check-btn').style.display = 'none';
                document.getElementById('stop-btn').style.display = 'none';
            }

            editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
                mode: cmMode, lineNumbers: true, indentUnit: 4, theme: edTheme,
                viewportMargin: Infinity,
                extraKeys: {"Ctrl-Space": "autocomplete"},
                autoCloseBrackets: true,
                matchBrackets: true
            });

            const hintDict = {
                python: { words: ["print", "input", "len", "int", "float", "str", "list", "dict", "set", "tuple", "range", "def", "return", "if", "elif", "else", "for", "while", "in", "not", "and", "or", "True", "False", "None", "sum", "min", "max", "sorted", "append", "pop", "remove", "keys", "values", "items", "get", "split", "join", "upper", "lower", "replace", "isdigit", "isalpha", "startswith", "import", "from", "as", "try", "except", "finally", "raise", "class", "self", "super", "lambda", "yield"], brackets: ["print", "input", "len", "int", "float", "str", "list", "dict", "set", "tuple", "range", "sum", "min", "max", "sorted", "append", "pop", "remove", "keys", "values", "items", "get", "split", "join", "upper", "lower", "replace", "isdigit", "isalpha", "startswith"] },
                java: { words: ["public", "class", "static", "void", "main", "String", "System", "out", "println", "int", "double", "boolean", "if", "else", "for", "while", "return", "new", "import", "package", "extends", "implements", "interface", "try", "catch", "finally", "throw", "throws", "this", "super", "null", "true", "false", "private", "protected", "final", "abstract"], brackets: [] },
                cpp: { words: ["include", "iostream", "stdio.h", "using", "namespace", "std", "int", "main", "return", "printf", "cout", "cin", "endl", "if", "else", "for", "while", "do", "switch", "case", "break", "continue", "void", "char", "float", "double", "struct", "class", "public", "private", "protected", "new", "delete", "nullptr", "true", "false", "string", "vector"], brackets: ["printf", "cout", "cin"] },
                c: { words: ["include", "stdio.h", "stdlib.h", "int", "main", "return", "printf", "scanf", "if", "else", "for", "while", "do", "switch", "case", "break", "continue", "void", "char", "float", "double", "struct", "malloc", "free", "null", "true", "false", "NULL"], brackets: ["printf", "scanf", "malloc", "free"] },
                javascript: { words: ["console", "log", "let", "const", "var", "function", "return", "if", "else", "for", "while", "document", "getElementById", "querySelector", "addEventListener", "alert", "prompt", "parseInt", "parseFloat", "Math", "random", "Array", "push", "pop", "length", "true", "false", "null", "undefined", "window", "innerHTML", "value"], brackets: ["console.log", "alert", "prompt", "parseInt", "parseFloat", "querySelector", "getElementById", "addEventListener"] },
                html: { words: ["div", "span", "p", "a", "img", "ul", "ol", "li", "h1", "h2", "h3", "h4", "h5", "h6", "body", "head", "html", "script", "style", "link", "meta", "title", "table", "tr", "td", "th", "form", "input", "button", "br", "hr"], brackets: [] },
                css: { words: ["color", "background", "background-color", "margin", "padding", "border", "border-radius", "display", "flex", "grid", "width", "height", "max-width", "min-width", "font-size", "font-family", "font-weight", "text-align", "text-decoration", "position", "top", "left", "right", "bottom", "z-index", "opacity", "transform", "transition", "justify-content", "align-items", "gap"], brackets: [] }
            };
            const dict = hintDict[activeLang] || hintDict.python;

            function customHint(cm, options) {
                const cur = cm.getCursor(), token = cm.getTokenAt(cur), start = token.start, end = cur.ch;
                const word = token.string.slice(0, end - start).toLowerCase();
                if (!word) return null;
                let list = dict.words.filter(w => w.toLowerCase().startsWith(word));
                list = list.map(w => dict.brackets.includes(w) ? w + "()" : w);
                if (list.length === 0) return null;
                return { list: list, from: CodeMirror.Pos(cur.line, start), to: CodeMirror.Pos(cur.line, end) };
            }

            editor.on("inputRead", function(cm, change) {
                if (/[a-zA-Z_]/.test(change.text[0])) {
                    cm.showHint({ hint: customHint, completeSingle: false });
                }
            });

            let saveTimeout;
            editor.on('change', () => {
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(() => {
                    pywebview.api.save_key(`${activeLang}_code_trophy_${chapterId}`, editor.getValue());
                }, 500);
                if (activeLang === 'html' || activeLang === 'css') updateLivePreview();
            });

            const savedCode = userData[`${activeLang}_code_trophy_${chapterId}`];
            editor.setValue(savedCode || trophyData.practice.starter);
            if (activeLang === 'html' || activeLang === 'css') updateLivePreview();

        } catch (e) {
            document.getElementById('theory-content').textContent = t('msg_load_error') + e.message;
        }
    });

    function updateLivePreview() {
        if (activeLang !== 'html' && activeLang !== 'css') return;
        const code = editor.getValue();
        let htmlContent = code;
        if (activeLang === 'css') {
            htmlContent = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>${code}</style></head><body><h1>CSS Preview</h1><p>Этот текст стилизован вашим кодом.</p></body></html>`;
        }
        const frame = document.getElementById('preview-frame');
        if (frame) frame.srcdoc = htmlContent;
    }

    function checkWebTask() {
        if (!trophyData || !trophyData.practice) return;
        const frame = document.getElementById('preview-frame');
        if (!frame) return;
        const doc = frame.contentDocument || frame.contentWindow.document;

        const actualText = (doc.body.textContent || '').replace(/\s+/g, ' ').trim();
        const expectedText = (trophyData.practice.expected || '').replace(/\s+/g, ' ').trim();

        const actualCode = editor.getValue();
        const mustContain = trophyData.practice.must_contain || [];

        let missing = [];
        for (let tag of mustContain) {
            if (!actualCode.includes(tag)) missing.push(tag);
        }

        if (actualText === expectedText && missing.length === 0) {
            lessonPassed = true;
            if (!userData[`${activeLang}_status_trophy_${chapterId}`]) {
                pywebview.api.save_key(`${activeLang}_status_trophy_${chapterId}`, 'done').then(() => {
                    userData[`${activeLang}_status_trophy_${chapterId}`] = 'done';
                    updateStreakUI(); playSuccessSound(); showToast(t('msg_trophy_passed'), 'success');
                    pywebview.api.check_achievements().then(newAchs => {
                        if (newAchs && newAchs.length > 0) {
                            playAchievementSound();
                            newAchs.forEach(ach => { showToast(t('ach_unlocked') + ': ' + t(ach), 'success'); });
                        }
                    });
                });
            } else showToast(t('msg_output_correct'), 'success');
        } else {
            let err = '';
            let sub = '';
            if (actualText !== expectedText) {
                err = t('msg_text_mismatch');
                sub = `"${expectedText}" ${t('msg_got')} "${actualText}"`;
            }
            if (missing.length > 0) {
                const safeMissing = missing.map(m => m.replace(/</g, '&lt;').replace(/>/g, '&gt;')).join(', ');
                err = err || t('msg_tags_missing');
                sub += (sub ? ' · ' : '') + safeMissing;
            }
            showToast(err, 'error', sub);
        }
    }

    function startQuiz() {
        const oldBtn = document.getElementById('retry-quiz-btn');
        if (oldBtn) oldBtn.remove();

        if (!originalTrophyQuestions || originalTrophyQuestions.length === 0) {
            showQuizComplete();
            return;
        }
        shuffleAndResetQuestions();
        currentQuestionIndex = 0;
        quizErrorCount = 0;
        document.getElementById('quiz-container').style.display = 'flex';
        document.getElementById('editor-container').style.display = 'none';
        renderQuestion();
    }

    function updateQuizProgress() {
        const total = trophyData.questions ? trophyData.questions.length : 0;
        const answered = Math.min(currentQuestionIndex, total);
        const remaining = total - answered;
        document.getElementById('quiz-progress-label').textContent = `${t('quiz_question')} ${Math.min(currentQuestionIndex + 1, total)} ${t('quiz_of')} ${total}`;
        document.getElementById('quiz-progress-remaining').textContent = `${t('quiz_remaining')}: ${remaining} ${t('quiz_of')} ${total}`;
        document.getElementById('quiz-progress-fill').style.width = total ? `${Math.round((answered / total) * 100)}%` : '0%';
    }

    function renderQuestion() {
        updateQuizProgress();
        const q = trophyData.questions[currentQuestionIndex]; const qTextDiv = document.getElementById('question-text');
        qTextDiv.innerHTML = marked.parseInline(q.text || '');
        qTextDiv.querySelectorAll('code').forEach((block) => { block.innerHTML = hljs.highlight(block.textContent, { language: 'python' }).value; block.classList.add('hljs', 'inline-code'); });
        const optionsDiv = document.getElementById('options-container'); optionsDiv.innerHTML = '';
        document.getElementById('quiz-feedback').style.display = 'none';
        document.getElementById('next-question-btn').style.display = 'none';
        q.options.forEach((opt, index) => {
            const btn = document.createElement('button'); btn.className = 'quiz-option'; btn.textContent = opt;
            btn.onclick = () => checkAnswer(index, btn); optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(selectedIndex, btnElement) {
        const q = trophyData.questions[currentQuestionIndex]; const feedback = document.getElementById('quiz-feedback');
        document.querySelectorAll('.quiz-option').forEach(b => b.disabled = true);
        if (selectedIndex === q.answer) { btnElement.classList.add('correct'); feedback.innerHTML = `<div style="color: #22c55e; margin-bottom: 10px;">✅ ${t('quiz_correct')}</div><p>${q.explanation}</p>`; }
        else {
            quizErrorCount++;
            btnElement.classList.add('wrong');
            feedback.innerHTML = `<div style="color: #ff6b6b; margin-bottom: 10px;">❌ ${t('quiz_wrong')}</div><p>${q.explanation}</p>`;
        }       feedback.style.display = 'block';
        const nextBtn = document.getElementById('next-question-btn');
        nextBtn.style.display = 'block';
        const total = trophyData.questions.length, remaining = total - currentQuestionIndex - 1;
        document.getElementById('quiz-progress-remaining').textContent = `${t('quiz_remaining')}: ${remaining} ${t('quiz_of')} ${total}`;
        document.getElementById('quiz-progress-fill').style.width = `${Math.round(((currentQuestionIndex + 1) / total) * 100)}%`;
        nextBtn.textContent = currentQuestionIndex + 1 < total ? t('btn_next') : t('btn_finish');
    }

    document.getElementById('next-question-btn').onclick = () => {
        currentQuestionIndex++;
        if (currentQuestionIndex < trophyData.questions.length) {
            renderQuestion();
        } else {
            const total = trophyData.questions.length;
            if (quizErrorCount * 2 >= total) {
                failQuiz();
                return;
            }
            completeQuiz();
        }
    };

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
    }

    function shuffleAndResetQuestions() {
        if (!originalTrophyQuestions || originalTrophyQuestions.length === 0) return;
        const shuffled = JSON.parse(JSON.stringify(originalTrophyQuestions));
        shuffleArray(shuffled);
        for (const q of shuffled) {
            if (Array.isArray(q.options)) {
                const correctOption = q.options[q.answer];
                shuffleArray(q.options);
                q.answer = q.options.indexOf(correctOption);
            }
        }
        trophyData.questions = shuffled;
    }

    function failQuiz() {
        quizErrorCount = 0;
        currentQuestionIndex = 0;
        document.getElementById('quiz-container').style.display = 'none';

        // Показываем теорию (без "Завершить чтение")
        document.getElementById('theory-title').textContent = trophyData.title;
        const infoDiv = document.getElementById('theory-content');
        infoDiv.innerHTML = marked.parse(trophyData.theory || trophyData.description || '');
        infoDiv.querySelectorAll('pre code').forEach((block) => { hljs.highlightElement(block); });

        showToast(t('msg_quiz_failed'), 'error');

        let retryBtn = document.getElementById('retry-quiz-btn');
        if (!retryBtn) {
            retryBtn = document.createElement('button');
            retryBtn.id = 'retry-quiz-btn';
            retryBtn.className = 'btn btn-run';
            retryBtn.style.marginTop = '30px';
            infoDiv.appendChild(retryBtn);
        }
        retryBtn.textContent = t('btn_retry_test');
        retryBtn.onclick = () => {
            retryBtn.remove();
            startQuiz();
        };
    }

    async function completeQuiz() {
        if (userData[`${activeLang}_status_trophy_${chapterId}`] !== 'done') {
            await pywebview.api.save_key(`${activeLang}_status_trophy_${chapterId}`, 'done');
            // Сохраняем флаг, если не было ни одной ошибки (для ачивки «Перфекционист»)
            if (quizErrorCount === 0) {
                await pywebview.api.save_key(`perfect_quiz_${activeLang}_${chapterId}`, true);
            }
            userData[`${activeLang}_status_trophy_${chapterId}`] = 'done';
            updateStreakUI();
            playSuccessSound();
            pywebview.api.check_achievements().then(newAchs => {
                if (newAchs && newAchs.length > 0) {
                    playAchievementSound();
                    newAchs.forEach(ach => {
                        showToast(t('ach_unlocked') + ': ' + t(ach.id), 'success', '', 'icons/' + ach.icon);
                    });
                }
            });
        }
        showQuizComplete();
    }

    function showQuizComplete() {
        document.getElementById('quiz-container').style.display = 'flex';
        document.getElementById('editor-container').style.display = 'none';
        document.querySelector('.quiz-progress').style.display = 'none';
        document.getElementById('question-text').style.display = 'none';
        document.getElementById('options-container').style.display = 'none';
        document.getElementById('quiz-feedback').style.display = 'none';
        document.getElementById('next-question-btn').style.display = 'none';
        document.getElementById('quiz-complete').style.display = 'block';
    }

    function initTerminal() {
        // Терминал наследует тему приложения: иначе в светлой теме он остаётся чёрным прямоугольником.
        const termTheme = userData.settings_app_theme === 'light'
            ? { background: '#ffffff', foreground: '#1f2937', cursor: '#0284c7', selection: '#bae6fd' }
            : { background: '#1e1e1e', foreground: '#d4d4d4', cursor: '#4ec9b0', selection: '#264f78' };
        term = new Terminal({ cursorBlink: true, theme: termTheme, fontFamily: 'Consolas, monospace', fontSize: parseInt(userData.settings_font_size || 15) });
        term.open(document.getElementById('terminal-container'));
        term.onData(data => { if (window.pywebview) pywebview.api.send_input_to_pty(data); });
        window.writeToTerminal = (data) => { term.write(data); terminalOutput += data; checkResultInstant(); };
        window.terminalProcessEnded = () => { document.getElementById('run-btn').style.display = 'inline-flex'; document.getElementById('stop-btn').style.display = 'none'; checkResultEnd(); };
    }

    function playSuccessSound() {
        if (userData.settings_sound === false) return;
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)(); const osc = ctx.createOscillator(), gain = ctx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(1046.50, ctx.currentTime);
            gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
            osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.5);
        } catch(e) {}
    }

    function cleanTerminalOutput(text) {
        if (!text) return "";
        let clean = text.replace(/\x1b\[[0-9;?]*[a-zA-Z]/g, '').replace(/\x1b\][^\x07]*\x07/g, '').replace(/\x1b[()][A-Z0-9]/g, '').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, '');
        return clean.split('\n').map(l => l.trim()).filter(l => l.length > 0).join('\n');
    }

    function checkResultInstant() {
        if (lessonPassed || !trophyData || !trophyData.practice) return;
        const expected = cleanTerminalOutput(trophyData.practice.expected); if (expected.length === 0) return;
        const actualLines = cleanTerminalOutput(terminalOutput).split('\n'), expectedLines = expected.split('\n'); let matchIndex = 0;
        for (let i = 0; i < actualLines.length; i++) {
            if (actualLines[i] === expectedLines[matchIndex]) {
                matchIndex++;
                if (matchIndex === expectedLines.length) {
                    lessonPassed = true;
                    if (!userData[`${activeLang}_status_trophy_${chapterId}`]) {
                        pywebview.api.save_key(`${activeLang}_status_trophy_${chapterId}`, 'done').then(() => {
                            userData[`${activeLang}_status_trophy_${chapterId}`] = 'done';
                            updateStreakUI(); playSuccessSound();
                            term.write(`\r\n\x1b[32m───────────────────────────────────────\x1b[0m\r\n`);
                            term.write(`\x1b[32m  ${t('msg_term_trophy_passed')}\x1b[0m\r\n`);
                            term.write(`\x1b[32m───────────────────────────────────────\x1b[0m\r\n`);
                            pywebview.api.check_achievements().then(newAchs => {
                                if (newAchs && newAchs.length > 0) {
                                    playAchievementSound();
                                    newAchs.forEach(ach => { showToast(t('ach_unlocked') + ': ' + t(ach), 'success'); });
                                }
                            });
                        });
                    } else {
                        term.write(`\r\n\x1b[32m───────────────────────────────────────\x1b[0m\r\n`);
                        term.write(`\x1b[32m  ${t('msg_term_output_correct')}\x1b[0m\r\n`);
                        term.write(`\x1b[32m───────────────────────────────────────\x1b[0m\r\n`);
                    }
                    return;
                }
            } else if (matchIndex > 0) matchIndex = 0;
        }
        if (actualLines.length > expectedLines.length + 5) {
            lessonPassed = true;
            term.write(`\r\n\x1b[33m⚠  ${t('msg_term_mismatch')}\x1b[0m\r\n`);
        }
    }

    function checkResultEnd() {
        if (lessonPassed || !trophyData || !trophyData.practice) return;
        const expected = cleanTerminalOutput(trophyData.practice.expected), actual = cleanTerminalOutput(terminalOutput);
        if (actual === expected && expected.length > 0) checkResultInstant();
        else if (actual.length > 0) term.write(`\r\n\x1b[33m⚠  ${t('msg_term_mismatch')}\x1b[0m\r\n`);
    }

    async function startTerminal() {
        const code = editor.getValue();
        term.reset(); terminalOutput = ""; lessonPassed = false;
        document.getElementById('run-btn').style.display = 'none';
        document.getElementById('stop-btn').style.display = 'inline-flex';

        const result = await pywebview.api.start_interactive_code(code);
        if (result.error) {
            term.write(t('msg_run_error') + result.error + '\r\n');
            document.getElementById('run-btn').style.display = 'inline-flex';
            document.getElementById('stop-btn').style.display = 'none';
        }
    }

    function stopTerminal() { pywebview.api.stop_interactive_code(); document.getElementById('run-btn').style.display = 'inline-flex'; document.getElementById('stop-btn').style.display = 'none'; }

    async function updateStreakUI() {
        try {
            const status = await pywebview.api.get_streak_status(); document.getElementById('topbar-streak-count').textContent = status.streak;
            const icon = document.getElementById('topbar-streak-icon'), widget = document.getElementById('topbar-streak-widget');
            if (status.frozen) { icon.style.filter = 'hue-rotate(180deg)'; widget.style.opacity = '1'; widget.title = t('streak_frozen_hint'); }
            else if (status.streak > 0) { icon.style.filter = 'none'; widget.style.opacity = '1'; widget.title = ''; }
            else { icon.style.filter = 'grayscale(100%)'; widget.style.opacity = '0.5'; widget.title = ''; }
        } catch(e) {}
    }

    function resetCode() {
        if (editor && trophyData) {
            editor.setValue(trophyData.practice.starter);
            pywebview.api.save_key(`${activeLang}_code_trophy_${chapterId}`, trophyData.practice.starter);
            if (activeLang === 'html' || activeLang === 'css') updateLivePreview();
        }
    }
    window.addEventListener('resize', () => { if (editor) editor.refresh(); if (term) term.refresh(0, term.rows - 1); });
</script>
</body>
