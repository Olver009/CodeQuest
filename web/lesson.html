<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>CodeQuest</title>
    <link rel="stylesheet" href="style.css">
    <script src="i18n.js"></script>
    <script src="drag.js"></script>
    <script src="toast.js"></script> <!-- ПОДКЛЮЧЕН TOAST -->
    <link rel="stylesheet" href="vendor/codemirror/codemirror.min.css">
    <link rel="stylesheet" href="vendor/codemirror/theme/material-darker.min.css">
    <script src="vendor/codemirror/codemirror.min.js"></script>
    <script src="vendor/codemirror/mode/python/python.min.js"></script>
    <link rel="stylesheet" href="vendor/codemirror/addon/hint/show-hint.min.css">
    <script src="vendor/codemirror/addon/hint/show-hint.min.js"></script>
    <script src="vendor/marked/marked.min.js"></script>
    <link rel="stylesheet" href="vendor/highlight/styles/vs2015.min.css">
    <script src="vendor/highlight/highlight.min.js"></script>
    <script src="vendor/highlight/languages/python.min.js"></script>
    <link rel="stylesheet" href="vendor/xterm/xterm.css" />
    <script src="vendor/xterm/xterm.js"></script>
</head>
<body>
<div id="app-container">
    <div class="titlebar">
        <div class="titlebar-left"><img src="icons/python.svg" class="titlebar-icon" alt="Icon"></div>
        <div class="titlebar-right">
            <button class="titlebar-btn" onclick="pywebview.api.minimize_window()">—</button>
            <button class="titlebar-btn" onclick="pywebview.api.toggle_maximize()">□</button>
            <button class="titlebar-btn btn-close" onclick="pywebview.api.close_window()">✕</button>
        </div>
    </div>

    <div class="layout">
        <aside class="sidebar-lesson">
            <button class="side-btn active">📖</button>
        </aside>

        <main class="main" style="padding: 0; max-width: 100%; align-items: stretch; overflow: hidden;">
            <div class="lesson" style="height: 100%;">
                <header class="lesson-topbar">
                    <div class="topbar-left">
                        <a href="index.html" class="close-btn" style="text-decoration: none;">×</a>
                        <h1 class="lesson-title" id="lesson-title">Загрузка...</h1>
                    </div>
                    <div class="topbar-stats">
                        <div class="stat stat-streak" id="topbar-streak-widget"><span class="stat-icon" id="topbar-streak-icon">🔥</span><span class="stat-val" id="topbar-streak-count">0</span></div>
                    </div>
                </header>

                <div class="lesson-body">
                    <aside class="theory-panel" id="theory-panel">
                        <div class="theory-header"><h2 class="theory-title" id="theory-title">Загрузка...</h2></div>
                        <section class="challenge"><div class="theory-content" id="theory-content"></div></section>
                    </aside>

                    <main class="code-view">
                        <div id="quiz-container" class="quiz-container" style="display: none;">
                            <div class="editor-toolbar"><div class="lang-select" data-i18n="questions">Вопросы</div></div>
                            <div class="quiz-content">
                                <h3 id="question-text" class="question-text"></h3>
                                <div id="options-container" class="options-container"></div>
                                <div id="quiz-feedback" class="quiz-feedback" style="display: none;"></div>
                                <button id="next-question-btn" class="btn btn-run" style="display: none; margin-top: 20px;" data-i18n="btn_next">Дальше</button>
                            </div>
                        </div>

                        <div id="editor-container" class="editor-container" style="display: none;">
                            <div class="editor-toolbar">
                                <div style="display: flex; align-items: center; gap: 12px;">
                                    <button id="btn-theory-task" class="icon-btn" style="width: auto; padding: 0 12px; font-size: 13px;" onclick="toggleTheoryTask()" data-i18n="lesson_theory">Теория</button>
                                    <div class="lang-select">Python</div>
                                </div>
                                <button id="btn-toggle-panel" class="icon-btn" style="width: auto; padding: 0 12px; font-size: 13px;" onclick="togglePanelVisibility()" data-i18n="lesson_hide">Скрыть панель</button>
                            </div>
                            <div class="editor-area"><textarea id="code-editor"></textarea></div>
                            <div class="console-panel">
                                <div class="editor-actions-bottom">
                                    <button class="btn btn-run" id="run-btn" onclick="startTerminal()" data-i18n="lesson_run">▶ Запустить код</button>
                                    <button class="btn btn-run" id="stop-btn" onclick="stopTerminal()" style="display: none; background: #c53030;" data-i18n="lesson_stop">■ Стоп</button>
                                </div>
                                <div class="console-tabs"><button class="console-tab active" data-i18n="lesson_result">РЕЗУЛЬТАТ</button></div>
                                <div class="console-body">
                                    <div class="console-col"><div class="console-label" data-i18n="lesson_terminal">Терминал</div><div id="terminal-container"></div></div>
                                    <div class="console-divider"></div>
                                    <div class="console-col"><div class="console-label" data-i18n="lesson_expected">Ожидаемый вывод</div><pre class="console-pre" id="console-expected"></pre></div>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
    let lessonData = null, lessonId = null, currentQuestionIndex = 0, editor = null, userData = {}, isPanelVisible = true, currentPanelView = 'theory', term = null, terminalOutput = "", lessonPassed = false;

    window.addEventListener('pywebviewready', async () => {
        await applyLanguage();
        const urlParams = new URLSearchParams(window.location.search);
        lessonId = urlParams.get('id') || 1;
        localStorage.setItem('lastVisitedNode', `node-${lessonId}`);
        try {
            updateStreakUI();
            userData = await pywebview.api.load_data();
            lessonData = await pywebview.api.get_lesson(lessonId);
            if (lessonData.error) throw new Error(lessonData.error);
            const fontSize = userData.settings_font_size || 15;
            document.documentElement.style.setProperty('--editor-font-size', fontSize + 'px');
            document.getElementById('lesson-title').textContent = lessonData.title;
            document.getElementById('console-expected').textContent = lessonData.practice.expected;
            initTerminal();
            if (userData[`quiz_${lessonId}`]) showPractice(); else { showTheoryContent(); startQuiz(); }
        } catch (e) {
            document.getElementById('theory-content').textContent = "Ошибка загрузки: " + e.message;
        }
    });

    function initTerminal() {
        term = new Terminal({ cursorBlink: true, theme: { background: '#1e1e1e', foreground: '#d4d4d4', cursor: '#4ec9b0', selection: '#264f78' }, fontFamily: 'Consolas, monospace', fontSize: parseInt(userData.settings_font_size || 15) });
        term.open(document.getElementById('terminal-container'));
        term.onData(data => { if (window.pywebview) pywebview.api.send_input_to_pty(data); });
        window.writeToTerminal = (data) => { term.write(data); terminalOutput += data; checkResultInstant(); };
        window.terminalProcessEnded = () => { document.getElementById('run-btn').style.display = 'inline-flex'; document.getElementById('stop-btn').style.display = 'none'; checkResultEnd(); };
    }

    function playSuccessSound() {
        if (userData.settings_sound === false) return;
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1046.50, ctx.currentTime); // Нота C6 (звонкая)
            gain.gain.setValueAtTime(0.5, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6); // Плавное затухание
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.6);
        } catch(e) {}
    }

    function cleanTerminalOutput(text) {
        if (!text) return "";
        let clean = text.replace(/\x1b\[[0-9;?]*[a-zA-Z]/g, '').replace(/\x1b\][^\x07]*\x07/g, '').replace(/\x1b[()][A-Z0-9]/g, '').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, '');
        return clean.split('\n').map(l => l.trim()).filter(l => l.length > 0).join('\n');
    }

    function checkResultInstant() {
        if (lessonPassed || !lessonData || !lessonData.practice) return;
        const expected = cleanTerminalOutput(lessonData.practice.expected); if (expected.length === 0) return;
        const actualLines = cleanTerminalOutput(terminalOutput).split('\n'), expectedLines = expected.split('\n'); let matchIndex = 0;
        for (let i = 0; i < actualLines.length; i++) {
            if (actualLines[i] === expectedLines[matchIndex]) {
                matchIndex++;
                if (matchIndex === expectedLines.length) {
                    lessonPassed = true;
                    if (!userData[`status_${lessonId}`]) {
                        pywebview.api.save_key(`status_${lessonId}`, 'done').then(() => {
                            userData[`status_${lessonId}`] = 'done';
                            updateStreakUI();
                            playSuccessSound();
                            term.write('\r\n\x1b[32m✅ Отлично! Урок засчитан.\x1b[0m\r\n');

                            pywebview.api.check_achievements().then(newAchs => {
                                if (newAchs && newAchs.length > 0) {
                                    playAchievementSound();
                                    newAchs.forEach(ach => {
                                        showToast(t('ach_unlocked') + ': ' + t(ach), 'success');
                                    });
                                }
                            });
                        });
                    } else term.write('\r\n\x1b[32m✅ Вывод верный.\x1b[0m\r\n');
                    return;
                }
            } else if (matchIndex > 0) matchIndex = 0;
        }
        if (actualLines.length > expectedLines.length + 5) { lessonPassed = true; term.write('\r\n\x1b[33m⚠ Вывод не совпадает с ожидаемым.\x1b[0m\r\n'); }
    }

    function checkResultEnd() {
        if (lessonPassed || !lessonData || !lessonData.practice) return;
        const expected = cleanTerminalOutput(lessonData.practice.expected), actual = cleanTerminalOutput(terminalOutput);
        if (actual === expected && expected.length > 0) checkResultInstant();
        else if (actual.length > 0) term.write('\r\n\x1b[33m⚠ Вывод не совпадает с ожидаемым.\x1b[0m\r\n');
    }

    async function startTerminal() {
        const code = editor.getValue(); term.reset(); terminalOutput = ""; lessonPassed = false;
        document.getElementById('run-btn').style.display = 'none'; document.getElementById('stop-btn').style.display = 'inline-flex';
        const result = await pywebview.api.start_interactive_code(code);
        if (result.error) { term.write('Ошибка запуска: ' + result.error + '\r\n'); document.getElementById('run-btn').style.display = 'inline-flex'; document.getElementById('stop-btn').style.display = 'none'; }
    }

    function stopTerminal() { pywebview.api.stop_interactive_code(); document.getElementById('run-btn').style.display = 'inline-flex'; document.getElementById('stop-btn').style.display = 'none'; }

    async function updateStreakUI() {
        try {
            const status = await pywebview.api.get_streak_status(); document.getElementById('topbar-streak-count').textContent = status.streak;
            const icon = document.getElementById('topbar-streak-icon'), widget = document.getElementById('topbar-streak-widget');
            if (status.frozen) { icon.style.filter = 'hue-rotate(180deg)'; widget.style.opacity = '1'; }
            else if (status.streak > 0) { icon.style.filter = 'none'; widget.style.opacity = '1'; }
            else { icon.style.filter = 'grayscale(100%)'; widget.style.opacity = '0.5'; }
        } catch(e) {}
    }

    function showTheoryContent() {
        document.getElementById('theory-title').textContent = lessonData.title;
        const theoryDiv = document.getElementById('theory-content'); theoryDiv.innerHTML = marked.parse(lessonData.theory || '');
        theoryDiv.querySelectorAll('pre code').forEach((block) => { hljs.highlightElement(block); });
        currentPanelView = 'theory'; document.getElementById('btn-theory-task').textContent = userData.settings_lang === 'en' ? 'Task' : 'Задание';
    }

    function showTaskContent() {
        document.getElementById('theory-title').textContent = userData.settings_lang === 'en' ? 'Task' : 'Задание';
        document.getElementById('theory-content').innerHTML = marked.parse(lessonData.practice.description || '');
        currentPanelView = 'task'; document.getElementById('btn-theory-task').textContent = userData.settings_lang === 'en' ? 'Theory' : 'Теория';
    }

    function toggleTheoryTask() { if (!isPanelVisible) togglePanelVisibility(); if (currentPanelView === 'theory') showTaskContent(); else showTheoryContent(); if (editor) setTimeout(() => editor.refresh(), 50); }
    function togglePanelVisibility() {
        const panel = document.getElementById('theory-panel'), btn = document.getElementById('btn-toggle-panel');
        if (isPanelVisible) { panel.style.display = 'none'; btn.textContent = userData.settings_lang === 'en' ? 'Show panel' : 'Показать панель'; isPanelVisible = false; }
        else { panel.style.display = 'block'; btn.textContent = userData.settings_lang === 'en' ? 'Hide panel' : 'Скрыть панель'; isPanelVisible = true; }
        if (editor) setTimeout(() => editor.refresh(), 50);
    }

    function startQuiz() {
        if (!lessonData.questions || lessonData.questions.length === 0) { showPractice(); return; }
        document.getElementById('quiz-container').style.display = 'flex'; document.getElementById('editor-container').style.display = 'none'; renderQuestion();
    }

    function renderQuestion() {
        const q = lessonData.questions[currentQuestionIndex]; const qTextDiv = document.getElementById('question-text');
        qTextDiv.innerHTML = marked.parseInline(q.text || '');
        qTextDiv.querySelectorAll('code').forEach((block) => { block.innerHTML = hljs.highlight(block.textContent, { language: 'python' }).value; block.classList.add('hljs', 'inline-code'); });
        const optionsDiv = document.getElementById('options-container'); optionsDiv.innerHTML = ''; document.getElementById('quiz-feedback').style.display = 'none'; document.getElementById('next-question-btn').style.display = 'none';
        q.options.forEach((opt, index) => { const btn = document.createElement('button'); btn.className = 'quiz-option'; btn.textContent = opt; btn.onclick = () => checkAnswer(index, btn); optionsDiv.appendChild(btn); });
    }

    function checkAnswer(selectedIndex, btnElement) {
        const q = lessonData.questions[currentQuestionIndex]; const feedback = document.getElementById('quiz-feedback');
        document.querySelectorAll('.quiz-option').forEach(b => b.disabled = true);
        if (selectedIndex === q.answer) { btnElement.classList.add('correct'); feedback.innerHTML = `<div style="color: #22c55e; margin-bottom: 10px;">✅ Верно!</div><p>${q.explanation}</p>`; }
        else { btnElement.classList.add('wrong'); feedback.innerHTML = `<div style="color: #ff6b6b; margin-bottom: 10px;">❌ Неверно.</div><p>${q.explanation}</p>`; }
        feedback.style.display = 'block'; document.getElementById('next-question-btn').style.display = 'block';
    }

    document.getElementById('next-question-btn').onclick = async () => {
        currentQuestionIndex++;
        if (currentQuestionIndex < lessonData.questions.length) renderQuestion();
        else { await pywebview.api.save_key(`quiz_${lessonId}`, true); showPractice(); }
    };

    function showPractice() {
        document.getElementById('quiz-container').style.display = 'none'; document.getElementById('editor-container').style.display = 'flex'; showTaskContent();
        if (!editor) {
            editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), { mode: 'python', lineNumbers: true, indentUnit: 4, theme: 'material-darker', viewportMargin: Infinity, extraKeys: {"Ctrl-Space": "autocomplete"} });
            const pythonWords = ["print", "input", "len", "int", "float", "str", "list", "dict", "set", "tuple", "def", "return", "if", "elif", "else", "for", "while", "in", "not", "and", "or", "True", "False", "None", "range", "sum", "min", "max", "sorted", "append", "pop", "remove", "keys", "values", "items", "get", "split", "join", "upper", "lower", "replace", "isdigit", "isalpha", "startswith", "import", "from", "as", "try", "except", "finally", "raise", "class", "self", "super", "lambda", "yield"];
            function customHint(cm, options) {
                const cur = cm.getCursor(), token = cm.getTokenAt(cur), start = token.start, end = cur.ch; const word = token.string.slice(0, end - start).toLowerCase();
                let list = pythonWords.filter(w => w.toLowerCase().startsWith(word)); const anywordHints = CodeMirror.hint.anyword(cm, options);
                if (anywordHints && anywordHints.list) anywordHints.list.forEach(w => { if (!list.includes(w)) list.push(w); });
                if (list.length === 0) return null; return { list: list, from: CodeMirror.Pos(cur.line, start), to: CodeMirror.Pos(cur.line, end) };
            }
            editor.on("inputRead", function(cm, change) { const text = change.text[0]; if (/[a-zA-Z_]/.test(text) || text === '.') cm.showHint({ hint: customHint, completeSingle: false }); });
            let saveTimeout; editor.on('change', () => { clearTimeout(saveTimeout); saveTimeout = setTimeout(() => { pywebview.api.save_key(`code_${lessonId}`, editor.getValue()); }, 500); });
        }
        editor.setValue(userData[`code_${lessonId}`] || lessonData.practice.starter);
    }
    window.addEventListener('resize', () => { if (editor) editor.refresh(); if (term) term.refresh(0, term.rows - 1); });
</script>
</body>
</html>
